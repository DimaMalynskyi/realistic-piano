<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Midi Piano</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="instrument">
        <header class="piano-heading">
            <h1>Piano</h1>
        </header>
        <div class="piano-scroll" tabindex="0" aria-label="Scroll piano keyboard">
            <div class="piano" role="group" aria-label="Piano, C3 through B5"></div>
        </div>
        <p class="help">White keys: Z X C V B N M. Black keys: S D G H J.
            1: C3 &nbsp; 2: C4 &nbsp; 3: C5.</p>
        <p id="audio-status" role="status">Sound starts when you play a note.</p>
        <noscript>Enable JavaScript to play the piano.</noscript>
    </main>
</body>
</html>
